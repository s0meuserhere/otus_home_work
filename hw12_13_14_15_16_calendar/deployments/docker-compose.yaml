name: calendar

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: calendar
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 30

  # Накатывает миграции и завершается.
  migrations:
    build:
      context: ..
      dockerfile: build/migrations/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: calendar
    depends_on:
      postgres:
        condition: service_healthy

  calendar:
    build:
      context: ..
      dockerfile: build/calendar/Dockerfile
    environment:
      ENVIRONMENT: docker
      STORAGE_MODE: 1
      HTTP_PORT: 8080
      GRPC_PORT: 9191
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: calendar
    ports:
      - "8888:8080"
      - "9191:9191"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/hello"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  calendar_scheduler:
    build:
      context: ..
      dockerfile: build/calendar_scheduler/Dockerfile
    environment:
      ENVIRONMENT: docker
      STORAGE_MODE: 1
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: calendar
      RABBIT_HOST: rabbitmq
      RABBIT_USER: rabbit
      RABBIT_PASSWORD: password
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  calendar_sender:
    build:
      context: ..
      dockerfile: build/calendar_sender/Dockerfile
    environment:
      ENVIRONMENT: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: calendar
      RABBIT_HOST: rabbitmq
      RABBIT_USER: rabbit
      RABBIT_PASSWORD: password
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
